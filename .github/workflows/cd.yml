name: TaskFlow CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    workflow_dispatch:

    concurrency:
      group: cd-${{ github.ref}}
      cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        service: [api, frontend]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

       # Opcional: Docker Hub con secrets propios.
       # Solo corre si existe la variable DOCKERHUB_USERNAME en el environment.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}        # Access Token de Docker Hub, NUNCA la contraseña

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/taskflow-${{ matrix.service }}
                  name: docker.io/${{ env.DOCKERHUB_USERNAME }}/taskflow-${{ matrix.service }},enabled=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=taskflow-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=taskflow-${{ matrix.service }}

          name: resumen
          run: |
            echo "Imagenes publicadas:"
            echo "${{ steps.meta.outputs.tags }}"
